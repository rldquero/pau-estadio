<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PAU Estadio</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>PAU ESTADIO</h1>

<div class="contenedor">

<div class="bloque">

<h2>Cronología del partido</h2>

<div style="display:flex; gap:10px; margin-bottom:10px;">

<select id="eventoCronologia" style="flex:1; padding:10px;">

<option value="">Seleccionar evento...</option>

<option>Apertura de puertas</option>
<option>Inicio dispositivo preventivo</option>
<option>Activado protocolo grada visitante</option>
<option>Incidencia acceso puerta 1</option>
<option>Incidencia acceso puerta 2</option>
<option>Incidencia acceso puerta 3</option>
<option>Se recibe fotografía</option>
<option>Inicio del partido</option>
<option>Atención sanitaria grada norte</option>
<option>Atención sanitaria grada sur</option>
<option>Atención sanitaria grada visitante</option>
<option>Intervención seguridad privada</option>
<option>Intervención Policía Local</option>
<option>Intervención Guardia Civil</option>
<option>Lanzamiento de objetos</option>
<option>Parada temporal del partido</option>
<option>Reanudación del partido</option>
<option>Finalización del partido</option>
<option>Salida escalonada del público</option>
<option>Cierre del dispositivo</option>

</select>

<button type="button" onclick="añadirCronologia()">
Añadir
</button>

</div>

<textarea id="cronologia" rows="12"></textarea>

</div>

<div class="bloque">

<h2>Protocolos</h2>

<div class="protocolos">

<button onclick="añadirProtocolo('Activado protocolo sanitario')">
🚑 Protocolo sanitario
</button>

<button onclick="añadirProtocolo('Activado protocolo grada visitante')">
👥 Grada visitante
</button>

<button onclick="añadirProtocolo('Aviso a Policía Local')">
👮 Policía Local
</button>

<button onclick="añadirProtocolo('Aviso a Guardia Civil')">
🚓 Guardia Civil
</button>

<button onclick="añadirProtocolo('Activado protocolo antiviolencia')">
🚨 Protocolo antiviolencia
</button>

<button onclick="añadirProtocolo('Prohibido entrar al terreno de juego')">
⛔ Prohibido saltar al campo
</button>

</div>

</div>

</div>

<script>

function añadirCronologia(){

const select = document.getElementById("eventoCronologia");
const textarea = document.getElementById("cronologia");

if(select.value === "") return;

const ahora = new Date();

const hora = ahora.toLocaleTimeString("es-ES",{
hour:"2-digit",
minute:"2-digit"
});

textarea.value += hora + " - " + select.value + "\n";

select.value = "";

}

function añadirProtocolo(texto){

const textarea = document.getElementById("cronologia");

const ahora = new Date();

const hora = ahora.toLocaleTimeString("es-ES",{
hour:"2-digit",
minute:"2-digit"
});

textarea.value += hora + " - " + texto + "\n";

}

</script>

</body>
</html>
