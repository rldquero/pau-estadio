<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safety Stadium</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

<header class="topbar">
  <h1>SAFETY STADIUM</h1>
</header>

<main class="contenedor">

  <section class="panel">
    <h2>Operativa</h2>

    <div class="botones">
      <button class="btn rojo">Prevención Violencia</button>
      <button class="btn naranja">Cánticos</button>
      <button class="btn amarillo">Lanzamientos</button>
      <button class="btn azul">Asistencia Sanitaria</button>
      <button class="btn verde">Evacuación</button>
    </div>
  </section>

  <section class="panel">
    <h2>Nueva incidencia</h2>

    <div class="aviso">
      Haz clic sobre el plano para marcar el punto exacto de la incidencia.
    </div>

    <form class="formulario">
      <select id="tipo">
        <option value="">Tipo de incidencia</option>
        <option>Prevención Violencia</option>
        <option>Cánticos</option>
        <option>Lanzamientos</option>
        <option>Asistencia Sanitaria</option>
        <option>Evacuación</option>
      </select>

      <input id="zona" type="text" placeholder="Zona / Grada / Puerta">
      <textarea id="descripcion" placeholder="Descripción"></textarea>

      <button class="btn azul" type="submit">Guardar incidencia</button>
    </form>

    <div class="lista-incidencias">
      <h3>Incidencias registradas</h3>
      <div id="incidencias"></div>
    </div>
  </section>

  <section class="panel">
    <h2>Plano Operativo</h2>

    <div id="mapa" class="mapa">
      <img src="IMG/estadio.jpg" alt="Plano estadio">
      <div id="marcadores"></div>
    </div>
  </section>

</main>

<script src="JS/app.js"></script>

</body>
</html>
