<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ESTADIO EN DIRECTO</title>

  <link rel="stylesheet"
  href="https://unpkg.com/leaflet/dist/leaflet.css">

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#0f172a;
      color:white;
    }

    header{
      background:#020617;
      padding:20px;
      text-align:center;
    }

    #map{
      height:80vh;
      width:100%;
    }

    .info{
      padding:20px;
      background:#111827;
    }

    .estado{
      padding:10px;
      border-radius:10px;
      margin-bottom:10px;
    }

    .verde{
      background:#166534;
    }

    .amarillo{
      background:#a16207;
    }

    .rojo{
      background:#991b1b;
    }

  </style>
</head>

<body>

<header>

  <h1>ESTADIO NUEVO PEPICO AMAT</h1>

  <p>
    Información pública en directo
  </p>

</header>

<div id="map"></div>

<div class="info">

  <div class="estado verde">
    🟢 Puertas principales abiertas
  </div>

  <div class="estado amarillo">
    🟡 Acceso visitante con retenciones
  </div>

  <div class="estado rojo">
    🔴 Parking sur completo
  </div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const mapa = L.map("map",{
  crs:L.CRS.Simple,
  minZoom:-2,
  maxZoom:2
})

const ancho = 1200
const alto = 800

const bounds = [[0,0],[alto,ancho]]

L.imageOverlay(
  "/planos/plano-general.jpg",
  bounds
).addTo(mapa)

mapa.fitBounds(bounds)

const puntosPublicos = [

  {
    tipo:"puerta",
    nombre:"Puerta Principal",
    lat:500,
    lng:300,
    icono:"🚪"
  },

  {
    tipo:"sanitario",
    nombre:"Puesto sanitario",
    lat:300,
    lng:700,
    icono:"🚑"
  },

  {
    tipo:"aseo",
    nombre:"Aseos públicos",
    lat:600,
    lng:900,
    icono:"🚻"
  }

]

puntosPublicos.forEach(p => {

  const icono = L.divIcon({
    html:`
      <div style="
        font-size:28px;
        background:white;
        border-radius:50%;
        width:36px;
        height:36px;
        display:flex;
        align-items:center;
        justify-content:center;
      ">
        ${p.icono}
      </div>
    `,
    className:"",
    iconSize:[36,36]
  })

  L.marker(
    [p.lat,p.lng],
    {
      icon:icono
    }
  )
  .addTo(mapa)
  .bindPopup(`
    <b>${p.nombre}</b>
  `)

})

</script>

</body>
</html>
